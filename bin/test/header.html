<!DOCTYPE html>

  <style>
    @font-face {
      font-family: 'NRT';
      src: local('NRT-Reg'), local('NRT-Bold'), local('NRT'), local('Unikurd Jano'), local('Arial');
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 25mm;
      background-color: #0f172a;
      color: #f8fafc;

      display: flex;

      align-items: center;
      height: 25mm;
      padding: 0 10mm;
    }
    .left-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-img {
      width: 36px;
      height: 36px;
      display: block;
    }
    .company-info h2 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.8px;
    }
    .company-info span {
      font-size: 10.5px;
      color: #94a3b8;
      display: block;
    }
    .right-section {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
  </style>
</head>
