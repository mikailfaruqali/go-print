name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux amd64
          - goos: linux
            goarch: amd64
            archive_ext: .tar.gz
            binary_name: pdf
            asset_name: pdf_linux_amd64.tar.gz

          # Linux arm64
          - goos: linux
            goarch: arm64
            archive_ext: .tar.gz
            binary_name: pdf
            asset_name: pdf_linux_arm64.tar.gz

          # macOS amd64 (Intel)
          - goos: darwin
            goarch: amd64
            archive_ext: .tar.gz
            binary_name: pdf
            asset_name: pdf_darwin_amd64.tar.gz

          # macOS arm64 (Apple Silicon M1/M2/M3/M4)
          - goos: darwin
            goarch: arm64
            archive_ext: .tar.gz
            binary_name: pdf
            asset_name: pdf_darwin_arm64.tar.gz

          # Windows amd64 (64-bit)
          - goos: windows
            goarch: amd64
            archive_ext: .zip
            binary_name: pdf.exe
            asset_name: pdf_windows_amd64.zip

          # Windows arm64
          - goos: windows
            goarch: arm64
            archive_ext: .zip
            binary_name: pdf.exe
            asset_name: pdf_windows_arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build binary
        working-directory: engine
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o ${{ matrix.binary_name }} .

      - name: Package archive (tar.gz)
        if: matrix.archive_ext == '.tar.gz'
        run: |
          cd engine
          tar -czf ../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Package archive (zip)
        if: matrix.archive_ext == '.zip'
        run: |
          cd engine
          zip ../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
